[project]
name = "rosa-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.3",
    "rosa-starter",
    "streamlit>=1.65.0",
]

[project.scripts]
rosa-app = "rosa_app:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
rosa-starter = { git = "https://github.com/zhouy185/rosa-starter.git" }
